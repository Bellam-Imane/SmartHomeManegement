version: '3.8'

services:
  # هاد الجزء كيكريي الداتابيس
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Riham1234
      POSTGRES_DB: smarthome_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

# MongoDB
  mongodb:
    image: mongo:latest
    container_name: mongo_db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # InfluxDB (مهمة بزاف للـ IoT والـ Sensors)
  influxdb:
    image: influxdb:latest
    container_name: influx_db
    restart: always
    ports:
      - "8086:8086"
    volumes:
      - influx_data:/var/lib/influxdb2
volumes:
  postgres_data:
  mongo_data:
  influx_data: